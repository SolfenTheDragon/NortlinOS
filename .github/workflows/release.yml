name: Release

# Builds two release APKs and publishes them as a GitHub Release:
#   - NortlinOS-<version>.apk          HTTPS only, trusted certificates (nortlinos.allowInsecureServers=false)
#   - NortlinOS-<version>-insecure.apk accepts HTTP and self-signed certificates (=true)
# Both share one application ID and signature, so only one can be installed at a time.
# A signed AAB (always the HTTPS-only build) is included only when the Play upload keystore is
# configured.
#
# Trigger with either:
#   - a version tag push, e.g. `git tag v1.2.3 && git push origin v1.2.3`
#   - the "Run workflow" button, supplying a version manually
#
# Signing: configure these repository secrets to produce signed release APKs and a Play-ready AAB:
#   RELEASE_KEYSTORE_BASE64   - `base64 -w0 your-release.jks`
#   RELEASE_KEYSTORE_PASSWORD
#   RELEASE_KEY_ALIAS
#   RELEASE_KEY_PASSWORD
# Without them the workflow still publishes an unsigned APK for manual sideloading, but no AAB.

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version name to stamp (e.g. 1.2.3). Defaults to the pushed tag."
        required: false
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      # The secrets context is unavailable in step-level `if`, so resolve the check once here.
      HAS_KEYSTORE: ${{ secrets.RELEASE_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Resolve version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ -n "$INPUT_VERSION" ]; then
            NAME="$INPUT_VERSION"
          else
            NAME="${GITHUB_REF#refs/tags/v}"
          fi
          if [[ ! "$NAME" =~ ^[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Version must be a semantic version such as 1.2.3"
            exit 1
          fi
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "code=${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - name: Run unit tests
        run: ./gradlew test --no-daemon

      - name: Decode release keystore
        id: keystore
        if: ${{ env.HAS_KEYSTORE == 'true' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "path=$RUNNER_TEMP/release.jks" >> "$GITHUB_OUTPUT"

      - name: Assemble release APKs
        env:
          VERSION_NAME: ${{ steps.version.outputs.name }}
          VERSION_CODE: ${{ steps.version.outputs.code }}
          RELEASE_KEYSTORE_PATH: ${{ steps.keystore.outputs.path }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          # Insecure variant first; the HTTPS-only build then overwrites the shared output dir
          # and is what the later "Locate artifacts" step finds.
          ./gradlew assembleRelease --no-daemon \
            -Pnortlinos.allowInsecureServers=true \
            -PversionCode="$VERSION_CODE" \
            -PversionName="$VERSION_NAME"
          INSECURE_APK=$(find app/build/outputs/apk/release -maxdepth 1 -name "*.apk" -print -quit)
          test -n "$INSECURE_APK"
          cp "$INSECURE_APK" "NortlinOS-$VERSION_NAME-insecure.apk"
          ./gradlew assembleRelease --no-daemon \
            -Pnortlinos.allowInsecureServers=false \
            -PversionCode="$VERSION_CODE" \
            -PversionName="$VERSION_NAME"

      - name: Assemble Play upload bundle
        if: ${{ env.HAS_KEYSTORE == 'true' }}
        env:
          VERSION_NAME: ${{ steps.version.outputs.name }}
          VERSION_CODE: ${{ steps.version.outputs.code }}
          RELEASE_KEYSTORE_PATH: ${{ steps.keystore.outputs.path }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          ./gradlew bundleRelease --no-daemon \
            -Pnortlinos.allowInsecureServers=false \
            -PversionCode="$VERSION_CODE" \
            -PversionName="$VERSION_NAME"

      - name: Locate artifacts
        id: apk
        env:
          VERSION_NAME: ${{ steps.version.outputs.name }}
        run: |
          APK_PATH=$(find app/build/outputs/apk/release -maxdepth 1 -name "*.apk" -print -quit)
          test -n "$APK_PATH"
          echo "path=$APK_PATH" >> "$GITHUB_OUTPUT"
          cp "$APK_PATH" "NortlinOS-$VERSION_NAME.apk"
          if [ "$HAS_KEYSTORE" = "true" ]; then
            AAB_PATH=$(find app/build/outputs/bundle/release -maxdepth 1 -name "*.aab" -print -quit)
            test -n "$AAB_PATH"
            cp "$AAB_PATH" "NortlinOS-$VERSION_NAME.aab"
          fi

      - name: Verify APK signature
        if: ${{ env.HAS_KEYSTORE == 'true' }}
        env:
          VERSION_NAME: ${{ steps.version.outputs.name }}
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort | tail -1)
          "$APKSIGNER" verify --print-certs -v "NortlinOS-$VERSION_NAME.apk"
          "$APKSIGNER" verify --print-certs -v "NortlinOS-$VERSION_NAME-insecure.apk"

      - name: Verify Play bundle signature
        if: ${{ env.HAS_KEYSTORE == 'true' }}
        env:
          VERSION_NAME: ${{ steps.version.outputs.name }}
        run: |
          AAB="NortlinOS-$VERSION_NAME.aab"
          if ! unzip -Z1 "$AAB" | grep -Eq '^META-INF/[^/]+\.(RSA|DSA|EC)$'; then
            echo "::error::The Play upload bundle has no JAR signing certificate"
            exit 1
          fi
          jarsigner -verify -verbose -certs "$AAB"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "NortlinOS ${{ steps.version.outputs.name }}"
          tag_name: "v${{ steps.version.outputs.name }}"
          generate_release_notes: true
          files: |
            NortlinOS-${{ steps.version.outputs.name }}.apk
            NortlinOS-${{ steps.version.outputs.name }}-insecure.apk
            ${{ env.HAS_KEYSTORE == 'true' && format('NortlinOS-{0}.aab', steps.version.outputs.name) || '' }}
          body: |
            ### Which APK should I install?
            - **`NortlinOS-${{ steps.version.outputs.name }}.apk`** – HTTPS only. Requires a server address starting with `https://` and a certificate trusted by the watch.
            - **`NortlinOS-${{ steps.version.outputs.name }}-insecure.apk`** – also accepts plain `http://` servers and self-signed certificates. Traffic is not protected against interception, so use it only on networks you trust.

            Both builds share the same app ID and signature, so only one can be installed at a time. Switching between them keeps your data (install over the top with `adb install -r`).

            ${{ steps.keystore.outputs.path == '' && '> ⚠️ Built without a signing secret configured, so this APK is **unsigned**. No Play upload bundle was produced. Configure the `RELEASE_KEYSTORE_BASE64`/`RELEASE_KEYSTORE_PASSWORD`/`RELEASE_KEY_ALIAS`/`RELEASE_KEY_PASSWORD` repository secrets to publish a signed APK and Play-ready AAB.' || '' }}
