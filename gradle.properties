android.useAndroidX=true
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8

# Development convenience: accept plain-HTTP servers and self-signed/untrusted TLS certificates.
# Set to false (or delete) before building for the Play Store; the app then requires HTTPS with
# trusted certificates and the cleartext/trust-all code paths are disabled.
nortlinos.allowInsecureServers=true
